<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Decision Tree — 1e-13</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: white; font-family: monospace; font-size: 15px; overflow: auto; }

    #canvas-wrap {
      position: relative;
      margin: 0 auto;
    }

    svg#arrows {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 0;
    }

    .node-box {
      position: absolute;
      border: 1.5px solid #333;
      background: white;
      padding: 8px 14px;
      cursor: pointer;
      line-height: 22px;
      white-space: nowrap;
      user-select: none;
      text-align: left;
      z-index: 1;
    }
    .node-box:hover { background: #f5f5f5; }
    .red   { color: red; }
    .green { color: #00802b; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="canvas-wrap">
  <svg id="arrows"><defs>
    <marker id="arr" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#333"/>
    </marker>
  </defs></svg>
</div>

<script>
const treeData = {"id": 0, "label": "<b>Involvement Contra III?</b><br>entropy = 5.44e-01<br>samples = 64<br>value = [8, 56]", "is_leaf": false, "children": [{"id": 1, "label": "<b>Midline Extension?</b><br>entropy = 8.11e-01<br>samples = 32<br>value = [8, 24]", "is_leaf": false, "children": [{"id": 2, "label": "<b>Involvement Contra II?</b><br>entropy = 1e+00<br>samples = 16<br>value = [8, 8]", "is_leaf": false, "children": [{"id": 3, "label": "entropy = 0e+00<br>samples = 8<br>value = [<span class=\"green\">8</span>, 0]", "is_leaf": true, "children": [], "edge_label": "No"}, {"id": 4, "label": "entropy = 0e+00<br>samples = 8<br>value = [0, <span class=\"red\">8</span>]", "is_leaf": true, "children": [], "edge_label": "Yes"}], "edge_label": "No"}, {"id": 5, "label": "entropy = 0e+00<br>samples = 16<br>value = [0, <span class=\"red\">16</span>]", "is_leaf": true, "children": [], "edge_label": "Yes"}], "edge_label": "No"}, {"id": 6, "label": "entropy = 0e+00<br>samples = 32<br>value = [0, <span class=\"red\">32</span>]", "is_leaf": true, "children": [], "edge_label": "Yes"}]};

const H_GAP = 40;
const V_GAP = 80;
const PAD   = 60;
const BOX_H = 88;
const LBL_W = 24;

// ── Step 1: measure every node's box width off-screen ─────────────
const scratch = document.createElement("div");
scratch.style.cssText = "position:absolute;visibility:hidden;top:-9999px;left:-9999px;";
document.body.appendChild(scratch);

const widthMap = {};
function measureNode(node) {
  const div = document.createElement("div");
  div.className = "node-box";
  div.style.position = "static";
  div.innerHTML = node.label;
  scratch.appendChild(div);
  widthMap[node.id] = div.offsetWidth;
  if (!node.is_leaf) node.children.forEach(measureNode);
}
measureNode(treeData);
document.body.removeChild(scratch);

// ── Step 2: assign positions using own-width spacing per level ────
function assignPositions(node, parentCx, y) {
  const w = widthMap[node.id];
  node.bw = w;
  node.by = y;
  node.cx = parentCx;
  node.bx = parentCx - w / 2;

  if (node.is_leaf || node.children.length === 0) return;

  const spanW = node.children.reduce((s, c) => s + widthMap[c.id], 0)
              + H_GAP * (node.children.length - 1);

  let cx = parentCx - spanW / 2;
  node.children.forEach(child => {
    const cw = widthMap[child.id];
    assignPositions(child, cx + cw / 2, y + BOX_H + V_GAP);
    cx += cw + H_GAP;
  });
}

assignPositions(treeData, PAD + widthMap[treeData.id] / 2, PAD);

// ── Step 3: shift right if any node clips left edge ───────────────
function minBx(node) {
  let m = node.bx;
  if (!node.is_leaf) node.children.forEach(c => { m = Math.min(m, minBx(c)); });
  return m;
}
const shift = Math.max(0, PAD - minBx(treeData));
function applyShift(node) {
  node.bx += shift; node.cx += shift;
  if (!node.is_leaf) node.children.forEach(applyShift);
}
if (shift > 0) applyShift(treeData);

// ── Step 4: canvas size ───────────────────────────────────────────
function treeMaxXY(node) {
  let mx = node.bx + node.bw + PAD;
  let my = node.by + BOX_H   + PAD;
  if (!node.is_leaf) node.children.forEach(c => {
    const [cx, cy] = treeMaxXY(c);
    mx = Math.max(mx, cx); my = Math.max(my, cy);
  });
  return [mx, my];
}
const [cw, ch] = treeMaxXY(treeData);
const wrap = document.getElementById("canvas-wrap");
wrap.style.width  = cw + "px";
wrap.style.height = ch + "px";
const svg = document.getElementById("arrows");
svg.setAttribute("width",  cw);
svg.setAttribute("height", ch);

// ── Step 5: render all nodes at fixed absolute positions ──────────
const boxEls = {};

function renderAll(node, isRoot) {
  const div = document.createElement("div");
  div.className = "node-box";
  div.innerHTML = node.label;
  div.style.left  = node.bx + "px";
  div.style.top   = node.by + "px";
  div.style.width = node.bw + "px";
  wrap.appendChild(div);
  boxEls[node.id] = div;

  if (!isRoot) div.classList.add("hidden");

  if (!node.is_leaf && node.children.length > 0) {
    div.addEventListener("click", () => {
      const anyVisible = node.children.some(
        c => !boxEls[c.id].classList.contains("hidden")
      );
      if (anyVisible) {
        hideSubtree(node);
      } else {
        node.children.forEach(c => boxEls[c.id].classList.remove("hidden"));
      }
      drawAllArrows();
    });
  }
  if (!node.is_leaf) node.children.forEach(c => renderAll(c, false));
}

function hideSubtree(node) {
  node.children.forEach(c => {
    boxEls[c.id].classList.add("hidden");
    if (!c.is_leaf) hideSubtree(c);
  });
}

renderAll(treeData, true);

// ── Step 6: draw broken arrows + inline No/Yes labels ────────────
function drawAllArrows() {
  Array.from(svg.children).forEach(c => {
    if (c.tagName !== "defs") svg.removeChild(c);
  });

  function drawNode(node) {
    if (node.is_leaf || node.children.length === 0) return;
    node.children.forEach(child => {
      if (boxEls[child.id].classList.contains("hidden")) return;

      const x1 = node.bx  + node.bw  / 2;
      const y1 = node.by  + BOX_H;
      const x2 = child.bx + child.bw / 2;
      const y2 = child.by - 8;

      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;

      const dx  = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const ux  = dx / len, uy = dy / len;

      const gx1 = mx - ux * LBL_W, gy1 = my - uy * LBL_W;
      const gx2 = mx + ux * LBL_W, gy2 = my + uy * LBL_W;

      const seg1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      seg1.setAttribute("x1", x1);  seg1.setAttribute("y1", y1);
      seg1.setAttribute("x2", gx1); seg1.setAttribute("y2", gy1);
      seg1.setAttribute("stroke", "#333");
      seg1.setAttribute("stroke-width", "1.5");
      svg.appendChild(seg1);

      const seg2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      seg2.setAttribute("x1", gx2); seg2.setAttribute("y1", gy2);
      seg2.setAttribute("x2", x2);  seg2.setAttribute("y2", y2);
      seg2.setAttribute("stroke", "#333");
      seg2.setAttribute("stroke-width", "1.5");
      seg2.setAttribute("marker-end", "url(#arr)");
      svg.appendChild(seg2);

      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x",                mx);
      txt.setAttribute("y",                my);
      txt.setAttribute("font-size",        "13");
      txt.setAttribute("fill",             "#444");
      txt.setAttribute("font-family",      "monospace");
      txt.setAttribute("text-anchor",      "middle");
      txt.setAttribute("dominant-baseline","middle");
      txt.textContent = child.edge_label || "";
      svg.appendChild(txt);

      drawNode(child);
    });
  }
  drawNode(treeData);
}

drawAllArrows();
</script>
</body>
</html>
